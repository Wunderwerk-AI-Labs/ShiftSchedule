name: Set agent model (truhn.ai)

# Sets the GLOBAL admin agent model (the self-hosted `openai_model` setting)
# in the production DB, from the LXC. Use to switch every user's planning
# model at once without the UI. The value is REQUIRED (no default) so this
# can never silently set the wrong model. Reasoning effort is left at the
# model default ("full") — this only sets the model id.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Exact endpoint model id to make the global default"
        required: true

jobs:
  set-model:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH (bastion jump)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY_FUER_SHIFTSCHEDULE_SERVER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_truhn
          chmod 600 ~/.ssh/id_truhn
          cat > ~/.ssh/config <<'CFG'
          Host truhn-bastion
            HostName 49.13.89.75
            Port 4444
            User dtruhn
            IdentityFile ~/.ssh/id_truhn
            StrictHostKeyChecking accept-new
            BatchMode yes

          Host truhn-target
            HostName 10.10.10.6
            User root
            IdentityFile ~/.ssh/id_truhn
            ProxyJump truhn-bastion
            StrictHostKeyChecking accept-new
            BatchMode yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Upsert openai_model in the production DB
        env:
          MODEL: ${{ inputs.model }}
        run: |
          ssh truhn-target MODEL="$MODEL" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/app
          docker compose -f docker-compose.proxied.yml exec -T -e MODEL="$MODEL" backend python - <<'PY'
          import os, sqlite3
          model = os.environ["MODEL"].strip()
          if not model:
              raise SystemExit("empty model — refusing to set")
          conn = sqlite3.connect("/data/schedule.db")
          before = dict(conn.execute("SELECT key, value FROM agent_settings").fetchall())
          print(f"before: provider={before.get('provider')!r} openai_model={before.get('openai_model')!r}")
          conn.execute(
              "INSERT INTO agent_settings (key, value) VALUES ('openai_model', ?) "
              "ON CONFLICT(key) DO UPDATE SET value = excluded.value",
              (model,),
          )
          conn.commit()
          after = dict(conn.execute("SELECT key, value FROM agent_settings").fetchall())
          print(f"after:  provider={after.get('provider')!r} openai_model={after.get('openai_model')!r}")
          PY
          EOF
