name: Agent arena (truhn.ai)

# Benchmark the agent solver against the complex-practice fixture, ON the
# production LXC (the only place that reaches the self-hosted LLM endpoint).
# Runs an isolated experiment process using the deployed harness and fixture.
# The selected prompt variant never changes production files or saved settings.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First day to solve (ISO)"
        default: "2026-02-02"
      days:
        description: "Number of days"
        default: "1"
      timeout:
        description: "Wall-clock budget in seconds"
        default: "600"
      model:
        description: "Self-hosted model ID"
        default: "VnimanieAI/Qwen3.8-Flash-Next-W4A16"
      variant:
        description: "Prompt experiment"
        type: choice
        options: [baseline, focused]
        default: baseline
      scenario:
        description: "base | vacation-wave | understaffed | crunch | oncall | pinned | daynight"
        default: "base"
      strategy:
        description: "day_by_day (standard) | repair (benchmark reference)"
        default: "day_by_day"
      reasoning:
        description: "reasoning effort: (empty) | low | medium | high"
        default: ""

jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: agent-arena-self-hosted-gpu
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH (bastion jump)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.SSH_KEY_FUER_SHIFTSCHEDULE_SERVER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_truhn
          chmod 600 ~/.ssh/id_truhn
          cat > ~/.ssh/config <<'CFG'
          Host truhn-bastion
            HostName 49.13.89.75
            Port 4444
            User dtruhn
            IdentityFile ~/.ssh/id_truhn
            StrictHostKeyChecking accept-new
            BatchMode yes
            ServerAliveInterval 30
            ServerAliveCountMax 120

          Host truhn-target
            HostName 10.10.10.6
            User root
            IdentityFile ~/.ssh/id_truhn
            ProxyJump truhn-bastion
            StrictHostKeyChecking accept-new
            BatchMode yes
          CFG
          chmod 600 ~/.ssh/config

      - name: Run the arena case on the LXC
        env:
          START: ${{ inputs.start }}
          DAYS: ${{ inputs.days }}
          TIMEOUT: ${{ inputs.timeout }}
          MODEL: ${{ inputs.model }}
          SCENARIO: ${{ inputs.scenario }}
          STRATEGY: ${{ inputs.strategy }}
          REASONING: ${{ inputs.reasoning }}
          VARIANT: ${{ inputs.variant }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          argv = ["prompt_eval", "--evaluation-ref", os.environ["GITHUB_SHA"]]
          for name in ("start", "days", "timeout", "model", "scenario", "strategy", "variant"):
              value = os.environ.get(name.upper(), "")
              if value:
                  argv.extend(["--" + name, value])
          if os.environ.get("REASONING"):
              argv.extend(["--reasoning-effort", os.environ["REASONING"]])
          source = "import sys\nsys.argv = " + repr(argv) + "\n"
          source += Path("backend/arena/prompt_eval.py").read_text()
          Path("arena_job.py").write_text(source)
          PY
          ssh truhn-target 'cd /opt/app && docker compose -f docker-compose.proxied.yml exec -T backend python -' \
            < arena_job.py | tee arena-trace.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prompt-evaluation-${{ github.run_id }}
          path: arena-trace.log
          retention-days: 14
